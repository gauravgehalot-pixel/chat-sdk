name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run quality
      - name: Verify release tag
        run: node -e 'const version=require("./package.json").version;if(process.env.GITHUB_REF_NAME!==`v${version}`)throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match v${version}`)'
      - run: npm publish --access public --provenance --tag beta
