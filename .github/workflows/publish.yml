name: Publish npm package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run quality
      - name: Check whether this version is unpublished
        id: version
        shell: bash
        run: |
          package_name=$(node -p 'require("./package.json").name')
          package_version=$(node -p 'require("./package.json").version')
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish latest with provenance
        if: steps.version.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --tag latest
      - name: Promote current version to latest
        if: steps.version.outputs.publish == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          package_name=$(node -p 'require("./package.json").name')
          package_version=$(node -p 'require("./package.json").version')
          npm dist-tag add "${package_name}@${package_version}" latest
      - name: Verify latest dist-tag
        timeout-minutes: 20
        shell: bash
        run: |
          package_name=$(node -p 'require("./package.json").name')
          package_version=$(node -p 'require("./package.json").version')
          # npm scans new releases before making them publicly available.
          # Poll fresh registry metadata for up to ten minutes between queries.
          for attempt in {1..21}; do
            if latest_version=$(npm view "${package_name}" dist-tags.latest --prefer-online --fetch-retries=0 --fetch-timeout=15000); then
              if [ "$latest_version" = "$package_version" ]; then
                echo "Verified ${package_name}@${package_version} is latest."
                exit 0
              fi
              echo "Attempt ${attempt}/21: latest is '${latest_version}'; expected '${package_version}'."
            else
              echo "Attempt ${attempt}/21: registry lookup failed; expected '${package_version}'."
            fi
            if [ "$attempt" -lt 21 ]; then
              sleep 30
            fi
          done
          echo "::error::npm latest did not resolve to ${package_name}@${package_version} within the verification window. Check npm processing status before rerunning."
          exit 1
